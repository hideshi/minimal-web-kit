{{define "layout"}}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - minimal-web-kit</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <div class="site-title">minimal-web-kit</div>
    <div class="site-subtitle">個人情報・外部依存を最小限に抑えたプライベートメモ</div>
    <nav>
      <a href="/">メモ一覧</a>
      <a href="/privacy">このアプリが保存するもの</a>
      <a href="/export">データのエクスポート (JSON)</a>
    </nav>
  </header>

  <main>
    {{template "content" .}}
  </main>

  <footer>
    <p>minimal-web-kit: 氏名・メールアドレス・電話番号等の個人情報は一切取得・保存していません。</p>
    <p>ブラウザのCookieを削除するとメモが消失します。定期的にエクスポートをご利用ください。</p>
  </footer>
</body>
</html>
{{end}}
