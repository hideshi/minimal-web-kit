{{define "layout"}}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - minimal-web-kit</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">本文へ移動</a>

  <header>
    <div class="site-title">minimal-web-kit</div>
    <div class="site-subtitle">個人情報・外部依存を最小限に抑えたWebアプリのひな形</div>
    <nav aria-label="メインナビゲーション">
      <a href="/">ホーム</a>
      <a href="/privacy">このアプリが保存するもの</a>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    {{template "content" .}}
  </main>

  <footer>
    <p>minimal-web-kit: 氏名・メールアドレス・電話番号等の個人情報は一切取得・保存していません。</p>
    <p>ブラウザのCookieを削除すると、この端末からのアクセス識別が切断されます（サーバー上のデータは30日後に自動削除されます）。</p>
  </footer>
</body>
</html>
{{end}}
