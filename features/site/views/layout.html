{{define "layout"}}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - minimal-web-kit</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">本文へ移動</a>

  <header>
    <div class="site-header-inner">
      <div>
        <div class="site-title"><a href="/" class="brand-link">minimal-web-kit</a></div>
        <div class="site-subtitle">個人開発と小規模プロジェクトのための超軽量Webひな形</div>
      </div>
      <nav aria-label="メインナビゲーション">
        <a href="#features">特長</a>
        <a href="#use-cases">ユースケース</a>
        <a href="#how-it-works">仕組み</a>
        <a href="#faq">FAQ</a>
        <a href="#contact">お問い合わせ</a>
        <a href="/privacy">プライバシー</a>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    {{template "content" .}}
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 minimal-web-kit. 直接依存はSQLiteのみ・完全セッションレスで構築されています。</p>
      <p><a href="/privacy">プライバシーポリシー（保存データについて）</a></p>
    </div>
  </footer>
</body>
</html>
{{end}}
