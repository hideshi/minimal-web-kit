{{define "content"}}
<h1>MCPの有効化の確認</h1>
<p>{{.Label}}のMCPを有効にします。次の注意を確かめてください。</p>
<p class="alert alert-warning">{{.Message}}</p>
<div class="action-bar">
  {{template "post-button" (postButton (printf "/admin/mcp/%v/enable" .Name) .CSRFToken "注意を確かめて有効にする" primaryButton (hiddenField "confirmed" "1"))}}
  <a href="/admin/mcp" class="btn btn-secondary">有効にせずに戻る</a>
</div>
{{end}}
