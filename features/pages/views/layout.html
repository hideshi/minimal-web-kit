{{define "layout"}}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - minimal-web-kit</title>
  {{template "static-head"}}
</head>
<body>
  <a href="#main-content" class="skip-link">本文へ移動</a>

  <header>
    <div class="site-header-inner public-header">
      <div>
        <div class="site-title"><a href="/" class="brand-link">minimal-web-kit</a></div>
      </div>
      {{template "public-menu" .}}
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    {{template "content" .}}
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 minimal-web-kit</p>
      <p><a href="/privacy">プライバシーポリシー（保存データについて）</a></p>
    </div>
  </footer>
</body>
</html>
{{end}}
