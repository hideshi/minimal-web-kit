{{define "content"}}
<h1>アカウントの追加</h1>

<p>アカウントを作ると、その人専用のパスキーの登録URLを発行します。URLは、メール以外の手段（チャット等）で本人に渡してください。このキットはメールを送りません。</p>

<form method="post" action="/admin/accounts" class="card">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  {{template "field" .NameField}}
  {{template "choices" .RoleChoices}}
  <button type="submit" class="btn btn-primary">作成して登録URLを発行する</button>
</form>

<p><a href="/admin/accounts">アカウントの一覧へ戻る</a></p>
{{end}}
