{{define "content"}}
<h1>{{.Title}}</h1>

<p class="alert alert-warning" role="status">この画面を再読み込みしないでください。登録URLは、この画面でしか表示できません。</p>

<div class="card">
  <p>「{{.Account.Name}}」（{{.Account.RoleLabel}}）のパスキーの登録URLです。24時間以内に1回だけ使えます。本人に渡し、URLを開いてパスキーを登録してもらってください。</p>
  {{template "field" .SetupURLField}}
</div>

<p><a href="/admin/accounts/{{.Account.ID}}" class="btn btn-secondary">アカウントの詳細へ</a></p>
{{end}}
