{{define "content"}}
<h1>お知らせの削除</h1>

<p>次のお知らせを削除します。削除すると元に戻せません。公開中の場合は、公開ページとAPIからも消えます。</p>

<p class="card">{{.Post.Title}}</p>

<div class="action-bar">
  <form method="post" action="/admin/posts/{{.Post.ID}}/delete" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit" class="btn btn-danger">削除する</button>
  </form>
  <a href="/admin/posts/{{.Post.ID}}" class="btn btn-secondary">削除せずに戻る</a>
</div>
{{end}}
