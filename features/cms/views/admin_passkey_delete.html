{{define "content"}}
<h1>パスキーの削除</h1>

<p>次のパスキーを削除します。削除すると、この認証器ではログインできなくなります。あわせて、今使っているこの画面以外のログイン状態をすべて解除します（紛失した端末でログインしたままにしないため）。</p>

<p class="card">{{.Credential.Label}}{{if .Credential.Disabled}}（無効・複製の疑い）{{end}}</p>

<div class="action-bar">
  <form method="post" action="/admin/passkeys/{{.Credential.Param}}/delete" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <button type="submit" class="btn btn-danger">削除する</button>
  </form>
  <a href="/admin/passkeys" class="btn btn-secondary">削除せずに戻る</a>
</div>
{{end}}
