{{define "content"}}
<h1>メモの編集</h1>

<form action="/memos/{{.Memo.ID}}" method="POST">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <div class="form-group">
    <label for="edit-title">タイトル</label>
    <input type="text" id="edit-title" name="title" required maxlength="100" value="{{.Memo.Title}}">
  </div>
  <div class="form-group">
    <label for="edit-content">本文</label>
    <textarea id="edit-content" name="content" required maxlength="10000">{{.Memo.Content}}</textarea>
  </div>
  <div class="memo-card-actions">
    <button type="submit" class="btn btn-primary">更新する</button>
    <a href="/memos" class="btn btn-secondary">一覧へ戻る</a>
  </div>
</form>
{{end}}
