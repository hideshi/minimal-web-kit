{{define "content"}}
<h1>お知らせ</h1>

{{if .Posts}}
<ul class="card-list" role="list">
  {{range .Posts}}
  <li class="card card-link">
    <h2 class="card-title"><a href="/news/{{.ID}}">{{.Title}}</a></h2>
    <p class="text-meta">公開日: {{template "date" .PublishedAt}}</p>
  </li>
  {{end}}
</ul>
{{else}}
<p>現在、公開中のお知らせはありません。</p>
{{end}}

{{template "pagination" .Page}}
{{end}}
