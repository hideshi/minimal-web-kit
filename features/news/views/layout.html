{{define "layout"}}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - minimal-web-kit</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">本文へ移動</a>

  <header>
    <div class="site-header-inner">
      <div>
        <div class="site-title"><a href="/" class="brand-link">minimal-web-kit</a></div>
      </div>
      <nav aria-label="メインナビゲーション">
        <a href="/">ホーム</a>
        <a href="/news">お知らせ</a>
        <a href="/privacy">プライバシーポリシー</a>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    {{template "content" .}}
  </main>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 minimal-web-kit</p>
      <p><a href="/privacy">プライバシーポリシー（保存データについて）</a></p>
    </div>
  </footer>
</body>
</html>
{{end}}
